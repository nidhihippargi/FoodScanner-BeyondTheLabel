name: Vision CI

on:
  push:
    paths:
      - "vision/**"
      - ".github/workflows/vision-ci.yml"
  pull_request:
    paths:
      - "vision/**"
      - ".github/workflows/vision-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vision-tests:
    name: Vision tests and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vision/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run strict TypeScript checks
        run: npm run typecheck